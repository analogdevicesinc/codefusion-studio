[project]
name = "cfsai-compatibility-analyzer"
version = "2.4.0"
description = "Thin wrapper — delegates to cfsai-model-explorer"
readme = "README.md"
requires-python = ">=3.11.9"
dependencies = [
    "cfsai-model-explorer",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
cfsai-model-explorer = { workspace = true }
